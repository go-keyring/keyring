name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: darwin (real Keychain round-trip, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test (real Keychain store/get/update/delete + core)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (OS-independent logic)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  windows:
    name: windows (real Credential Manager round-trip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Test (real Credential Manager + core)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'

  linux:
    name: linux (unit, CGO=0, core 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (unit, no daemon)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (OS-independent logic)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  linux-live:
    name: linux (live Secret Service round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Install GNOME Keyring
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools dbus-x11
      - name: Live round-trip vs gnome-keyring-daemon
        run: |
          rm -rf "$HOME/.local/share/keyrings"; mkdir -p "$HOME/.local/share/keyrings"
          dbus-run-session -- bash -c '
            set -e
            eval "$(printf "loginpass\n" | gnome-keyring-daemon --daemonize --login 2>/dev/null)" || true
            gnome-keyring-daemon --start --components=secrets >/dev/null 2>&1 || true
            sleep 1
            COLL=$(busctl --user get-property org.freedesktop.secrets /org/freedesktop/secrets \
              org.freedesktop.Secret.Service Collections 2>/dev/null \
              | grep -o "/org/freedesktop/secrets/collection/[A-Za-z0-9_]*" | head -1)
            busctl --user call org.freedesktop.secrets /org/freedesktop/secrets \
              org.freedesktop.Secret.Service SetAlias so "default" "$COLL" >/dev/null 2>&1 || true
            CGO_ENABLED=0 KEYRING_LIVE=1 go test -run TestLinuxLiveRoundTrip -v -count=1 ./...
          '

  crossbuild:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: s390x }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Cross-compile (CGO=0)
        run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
